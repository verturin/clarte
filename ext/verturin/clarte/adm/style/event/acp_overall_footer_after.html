{% if CLARTE_ACP and CLARTE_ACP_TABS %}
<script>
/* Clarté : les pages de la rubrique en cours (celle du menu de gauche) en onglets en haut de la page, toujours visibles */
(function () {
	var active = document.getElementById('activemenu'), main = document.querySelector('#main > .main') || document.getElementById('main');
	if (!active || !main) { return; }
	/* Seulement pour les extensions : leurs modules ont une adresse en i=-vendeur-extension-… */
	if (!/[?&]i=(-|%5C|\\)/.test(active.querySelector('a').getAttribute('href') || '')) { return; }
	var block = active.closest('.menu-block');
	if (!block) { return; }
	var links = block.querySelectorAll('ul > li > a');
	if (links.length < 2) { return; }
	var nav = document.createElement('nav'), title = block.querySelector('.header');
	nav.className = 'clarte-acp-subnav';
	nav.setAttribute('aria-label', title ? title.textContent.trim() : '');
	var list = document.createElement('ul');
	Array.prototype.forEach.call(links, function (a) {
		var li = document.createElement('li'), b = document.createElement('a');
		b.href = a.href;
		b.textContent = a.textContent.trim();
		if (a.parentNode.id === 'activemenu') { li.className = 'is-current'; b.setAttribute('aria-current', 'page'); }
		li.appendChild(b);
		list.appendChild(li);
	});
	nav.appendChild(list);
	main.insertBefore(nav, main.firstChild);
})();
</script>
{% endif %}
{% if CLARTE_ACP %}
<script>
(function () {
	var header = document.getElementById('page-header');
	if (!header) { return; }
	var d = document.documentElement, order = ['auto', 'light', 'dark'],
		icons = { auto: 'fa-adjust', light: 'fa-sun-o', dark: 'fa-moon-o' },
		labels = { auto: '{{ lang('CLARTE_MODE_AUTO')|e('js') }}', light: '{{ lang('CLARTE_MODE_LIGHT')|e('js') }}', dark: '{{ lang('CLARTE_MODE_DARK')|e('js') }}' },
		title = '{{ lang('CLARTE_MODE_TITLE')|e('js') }}',
		btn = document.createElement('button');
	btn.type = 'button';
	btn.className = 'clarte-acp-mode';
	function paint(m) {
		btn.innerHTML = '<i class="icon fa ' + icons[m] + ' fa-fw" aria-hidden="true"></i><span></span>';
		btn.lastChild.textContent = labels[m];
		btn.title = title + ' (' + labels[m] + ')';
	}
	paint(d.getAttribute('data-clarte-mode') || 'auto');
	btn.addEventListener('click', function () {
		var m = order[(order.indexOf(d.getAttribute('data-clarte-mode') || 'auto') + 1) % 3];
		d.setAttribute('data-clarte-mode', m);
		if (m === 'auto') { d.removeAttribute('data-theme'); } else { d.setAttribute('data-theme', m); }
		try { window.localStorage.setItem('clarte_mode', m); } catch (e) {}
		paint(m);
	});
	header.appendChild(btn);
})();
</script>
{% endif %}
